name: Probe and refresh catalog

on:
  schedule:
    # Weekly on Mondays at 09:37 UTC
    - cron: "37 9 * * 1"
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run build-time probes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/probe-curated.ts

      - name: Validate after probe
        run: bun run validate

      - name: Build after probe
        run: bun run build

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create pull request with refreshed data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b probe/refresh-$(date +%Y%m%d)
          git add -A
          git commit -m "probe: refresh catalog data

          Automated weekly probe of source URLs, GitHub repo stats,
          and staleness detection.

          Generated by GitHub Actions probe workflow.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push --set-upstream origin probe/refresh-$(date +%Y%m%d)
          gh pr create \
            --title "probe: refresh catalog data $(date +%Y-%m-%d)" \
            --body "Automated weekly probe of source URLs, GitHub repo stats, and staleness detection.

          ## What changed
          $(git diff --stat HEAD~1)

          ## Verification
          - [x] bun run validate passed
          - [x] bun run build passed

          Generated by GitHub Actions probe workflow." \
            --label "automated"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
